# 发版流程：推送 v* 标签（或在 GitHub 网页上发布 Release）自动触发，
# 在线构建 Windows 安装包（NSIS），产物自动挂到对应 Release。
# 手动触发（workflow_dispatch）仅构建校验，不出包到 Release。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tauri-action 需要创建 Release 并上传产物

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and attach to Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在 tag 触发时发布 Release；手动触发（分支 ref）tagName 为空 = 只构建校验
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'bMuisc ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包（NSIS）。首次构建版本的已知限制见 README。'
          releaseDraft: false
          prerelease: false
