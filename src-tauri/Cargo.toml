[package]
name = "bmuisc"
version = "0.3.1"
description = "B 站音乐播放器"
authors = ["roy2651"]
edition = "2021"

[lib]
name = "bmuisc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2" # 重复启动时聚焦已有窗口，防止出现多实例
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# TLS 必须用 native-tls（Windows=Schannel）：B 站 WAF 拦截 rustls 指纹（详见 docs/m0-findings.md §2.1）
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["http1"] }

# 自动更新（仅桌面端编译）：GitHub Releases latest.json + minisign 签名校验
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
