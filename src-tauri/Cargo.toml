[package]
name = "bmuisc"
version = "0.3.2"
description = "B 站音乐播放器"
authors = ["roy2651"]
edition = "2021"

[lib]
name = "bmuisc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2" # 重复启动时聚焦已有窗口，防止出现多实例
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# TLS 必须用 native-tls（Windows=Schannel）：B 站 WAF 拦截 rustls 指纹（详见 docs/m0-findings.md §2.1）
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
axum = { version = "0.8", features = ["http1"] }
# 账号凭证安全存储：Windows 凭据管理器 / macOS 钥匙串（SESSDATA 绝不明文落盘，见 docs/login-fav-research.md §2）
keyring = { version = "3", features = ["windows-native", "apple-native"] }
log = "0.4"

# 桌面端插件：自动更新（GitHub Releases latest.json + minisign 签名校验）
# + 文件日志（引擎/媒体事件时间线落盘，排查 mac 暂停等疑难时「回头看」）
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-log = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
